onboarding = false

[ui.toast]
delivery = "system"

[theme]
name = "gruvbox"
auto_switch = false

[terminal]
# Match tmux split behavior: new panes inherit the source pane's directory.
new_cwd = "follow"

[keys]
# Match the tmux prefix. Pressing Ctrl+A twice sends a literal Ctrl+A.
prefix = "ctrl+a"

# Reload, workspace creation, and pane navigation.
detach = "prefix+d"
reload_config = "prefix+r"
new_workspace = "prefix+enter"
cycle_pane_next = "prefix+tab"

# Keep Prefix+O available for Annotate while preserving Herdr's notification
# target action on a nearby, non-conflicting chord.
open_notification_target = "prefix+ctrl+n"

# Prefix-free navigation using explicit modified chords that survive remote
# terminals without depending on Option/Alt encoding or control characters.
previous_tab = "ctrl+shift+left"
next_tab = "ctrl+shift+right"
previous_workspace = "ctrl+shift+up"
next_workspace = "ctrl+shift+down"

# Use native split actions so the bindings are forwarded by `herdr --remote`.
# Herdr does not forward local custom-command bindings to remote servers.
split_vertical = "prefix+|"
split_horizontal = "prefix+minus"

# Prefix-free pane navigation. Shift avoids stealing the shell's Ctrl+h/j/k/l.
focus_pane_left = "ctrl+shift+h"
focus_pane_down = "ctrl+shift+j"
focus_pane_up = "ctrl+shift+k"
focus_pane_right = "ctrl+shift+l"

# Herdr exposes only one built-in reload binding. Keep Prefix+R as a server-side
# reload alias; Prefix+r above is the full client reload action.
[[keys.command]]
key = "prefix+shift+r"
type = "shell"
command = "\"$HERDR_BIN_PATH\" server reload-config"

# Local/server-keybindings-only approximation of tmux new-main. Local custom
# commands are intentionally not forwarded by `herdr --remote`.
[[keys.command]]
key = "alt+enter"
type = "shell"
command = "sh ~/.config/herdr/new-main.sh"

# Plugin shortcuts share the Ctrl+A prefix without taking Ctrl+A Ctrl+A away
# from send-prefix. Y/Shift+Y replace Annotate's conflicting copy shortcuts;
# Ctrl+R replaces reviewr's conflicting G shortcut. In terminal herdr --remote,
# these commands require remote plugin/config installation and server keybindings.
# GPUI can keep local navigation keys; commands come from the selected server.
# Remote terminal selection capture additionally requires
# the plugin's SSH/API workaround because any prefix key clears the selection.
[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "annotate.capture"
description = "annotate selected terminal text"

[[keys.command]]
key = "prefix+y"
type = "plugin_action"
command = "annotate.copy-context"
description = "copy annotations as context"

[[keys.command]]
key = "prefix+shift+y"
type = "plugin_action"
command = "annotate.copy-archive"
description = "copy annotations as context and archive them"

[[keys.command]]
key = "prefix+ctrl+v"
type = "plugin_action"
command = "annotate.paste-archive"
description = "paste annotations into the agent prompt and archive them"

[[keys.command]]
key = "prefix+ctrl+s"
type = "plugin_action"
command = "annotate.send-archive"
description = "send annotations to the agent and archive them"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "annotate.manage"
description = "manage annotations"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "annotate.open"
description = "review documents in this folder"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "annotate.last"
description = "review the agent's recent replies"

[[keys.command]]
key = "prefix+ctrl+o"
type = "plugin_action"
command = "annotate.last-newest"
description = "review the agent's newest reply"

[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "annotate.terminal"
description = "review recent terminal output"

[[keys.command]]
key = "prefix+ctrl+r"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "toggle the reviewr pane"
